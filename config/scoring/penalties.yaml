# Character / aesthetic score adjustments, detected from the listing text (title +
# description + options), NL/DE/EN. Points may be NEGATIVE (penalty) or POSITIVE (reward).
# Tune freely.
#
# NOTE: M Sport itself is intentionally NOT penalised (the brief: don't reward it, but
# don't reject a good car for it). Only the aggressive cosmetic add-ons are penalised.
penalties:
  large_wheels:
    label: 'Large wheels (21"+)'
    aliases: ['21 inch', '22 inch', '23 inch', '21 zoll', '22 zoll', '23 zoll', '21"', '22"', '23"', '21 inch velgen', '21 duim', '22 duim']
    points: -6

  shadow_line_blackout:
    label: "All-black / Shadow Line styling"
    aliases: ["shadow-line", "shadow line", "blackout", "black optic", "schwarz optik", "high-gloss shadow", "hochglanz shadow"]
    points: -4

  m_aero_carbon:
    label: "Aggressive M aero / carbon styling"
    aliases: ["m aerodynamik", "m aerodynamics", "aerodynamikpaket", "m carbon", "carbon spiegel", "m performance aero"]
    points: -3

  lowered_suspension:
    label: "Lowered suspension"
    aliases: ["verlaagd", "tieferlegung", "lowered", "h&r veren", "lowering springs"]
    points: -5

  # ---- Interior colour preference (black/dark = easy to keep clean; light = a chore) ----
  # Interior-specific colour names only, so they don't match an exterior "Schwarz".
  black_interior:
    label: "Black / dark interior (easy to keep clean)"
    aliases: ["leder schwarz", "leder zwart", "zwart leder", "merino schwarz", "vernasca schwarz",
              "sensatec schwarz", "nappa schwarz", "dakota schwarz", "leder anthrazit",
              "anthrazit leder", "interieur schwarz", "interieur zwart", "black leather", "zwart interieur"]
    points: 6

  light_interior:
    label: "Light/pale interior (harder to keep clean)"
    aliases: ["elfenbeinweiss", "elfenbeinweiß", "elfenbein", "rauchweiss", "rauchweiß",
              "ivory", "oyster", "canberrabeige", "canberra beige", "mokka", "tartufo",
              "cremebeige", "creme beige", "beige leder", "leder beige", "white leather",
              "leder weiss", "leder weiß", "wit leder", "smoke white"]
    points: -5
