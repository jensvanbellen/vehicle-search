# Search targets. Each is both a query spec and the "ideal" used for scoring.
# Per-source codes were verified against the live BMW lineup (June 2026).
# NOTE: equipment lists and year cutoffs are best-effort assumptions — tune freely.

home_postcode: "2548 AE"   # default; overridable via VF_HOME_POSTCODE

searches:
  # ----------------------------------------------------------------- MOTORCYCLES
  - id: s1000xr-2024
    vehicle_type: motorcycle
    make: BMW
    model: S 1000 XR
    aliases: ["S1000XR", "S 1000XR"]
    min_year: 2024
    countries: [NL, DE]
    preferred_equipment:
      - m_package
      - dynamic_package
      - touring_package
      - dynamic_esa
      - adaptive_cornering_headlight
      - heated_grips
      - cruise_control
      - keyless_ride
      - gear_shift_assistant_pro
      - nav_preparation
      - luggage_preparation
      - centre_stand
    source_codes:
      bmw-motorrad-nl:
        serie: "BMW Sport"
        model: "S 1000 XR"

  - id: r1300rs
    vehicle_type: motorcycle
    make: BMW
    model: R 1300 RS
    min_year: 2024
    countries: [NL, DE]
    preferred_equipment: [dynamic_esa, heated_grips, cruise_control, gear_shift_assistant_pro]
    source_codes:
      bmw-motorrad-nl:
        serie: "BMW Sport"      # verified: R 1300 RS lives under "BMW Sport"
        model: "R 1300 RS"

  - id: r12-ninet
    vehicle_type: motorcycle
    make: BMW
    model: R 12 nineT
    countries: [NL, DE]
    preferred_equipment: [heated_grips, gear_shift_assistant_pro, cruise_control]
    source_codes:
      bmw-motorrad-nl:
        serie: "BMW Heritage"   # verified: site model string is "R12 NineT"
        model: "R12 NineT"

  # ------------------------------------------------------------------------ CARS
  - id: x5-g05
    vehicle_type: car
    make: BMW
    model: X5
    variant_generation: G05
    # Target: late pre-LCI xDrive30d (48V mild-hybrid), comfort-oriented, LHD.
    # The X5 G05 LCI facelift began production ~spring 2023, so 2021-2022 (and very
    # early 2023) registrations are almost all pre-LCI. xDrive30d-vs-40d and pre/post-LCI
    # are NOT structured fields here — segment by the `engine` field + verify with seller.
    min_year: 2021
    max_year: 2023
    max_mileage: 80000
    fuel_type: diesel
    countries: [NL, DE]
    # Diesels only (the 48V mild-hybrid xDrive30d primary + xDrive40d fallback); this drops
    # the 45e PHEV / 40i petrol / M noise. Matched against variant + title.
    variant_includes: ["30d", "40d"]
    # Prioritised desirable options (scored when detected in the listing description).
    # Order is informational; the scorer weights each via scoring/features.yaml.
    preferred_equipment:
      - driving_assistant_professional   # hard-ish requirement (ACC stop&go + lane centering)
      - surround_view_camera             # Parking Assistant Plus / 360
      - air_suspension                   # adaptive two-axle air suspension
      - comfort_seats
      - seat_ventilation
      - seat_massage
      - heated_steering_wheel
      - head_up_display
      - four_wheel_steering              # Integral Active Steering
      - merino_leather
      - leather_dashboard
      - acoustic_glass
      - four_zone_climate
      - soft_close_doors
      - comfort_access
      - panoramic_roof                   # Sky Lounge
      - rear_sunblinds
      - auxiliary_heating
      - towbar
      - bowers_wilkins
      - harman_kardon
    # Understated/luxury colour preferences (used in manual ranking; informational).
    preferred_colours: [groen, grijs, blauw, antraciet]
    # Deal-breakers per the brief (these DROP a listing). Kept minimal to avoid over-filtering.
    excluded_terms: ["verlaagd onderstel", "gechipt", "stage 1", "stage 2"]
    source_codes:
      bmw-nl:
        serie: "BMW X Serie"
        model: "X5"
      bmw-de:
        marketing_model_range: "X5_G05"
        engine_type: "DIESEL"
        equipment_groups:
          wheelsAndTires: ["Aktive Sitzbelüftung vorn"]
          drivingAssistance: ["Adaptive 2-Achs-Luftfederung"]
      dasimport:
        brand: 3500
        model: 49
